#ERC20
type CollectionToken @entity {
  # Information set when token is initialized via Locker.CollectionCreated
  id: Bytes! #ERC20 Contract
  collection: Collection! #721 Collection / NFTAddress

  totalSupply: BigInt!
  pool: Pool!

  name: String!
  symbol: String!
  decimals: Int!
  baseURI: String!
  metadata: CollectionMetadata
  createdAt: BigInt!
  creator: User!
  native: Boolean!              # Tracks holdings if true, uses another holding if false
  importedToken: ImportedToken @derivedFrom(field: "collectionToken")
  owner: User!                  # Update when they transfer the ERC721
  marketCapETH: BigInt!         # unscaled
  volumeETH: BigInt!            # redundant
  marketCapUSDC: BigDecimal!    # unscaled
  volumeUSDC: BigDecimal!       # redundant
  totalFeesETH: BigInt!         
  totalFeesUSDC: BigDecimal!    
  derivedETH: BigInt!           # unscaled

  # running total fees for Community
  totalCommunityFeesETH: BigDecimal!
  # running total fees for Creator
  totalCreatorFeesETH: BigDecimal!
  tokenPrice: BigInt!
  totalHolders: BigInt! 
  creationFee: BigInt!
  fairLaunch: FairLaunch
  dayData: [TokenDayData!] @derivedFrom(field: "token")
  hourData: [TokenHourData!] @derivedFrom(field: "token")
  minuteData: [TokenMinuteData!] @derivedFrom(field: "token")
  fifteenMinuteData: [Token15MinuteData!] @derivedFrom(field: "token")
  fourHourData: [Token4HourData!] @derivedFrom(field: "token")
  holdings: [CollectionTokenHolding!] @derivedFrom(field: "collectionToken")

  # Archive helpers
  lastMinuteArchived: BigInt!
  lastHourArchived: BigInt!
  lastFifteenMinuteArchived: BigInt!
  lastFourHourArchived: BigInt!

  # Archive helpers
  minuteArray: [Int!]!
  hourArray: [Int!]!
  fifteenMinuteArray: [Int!]!
  fourHourArray: [Int!]!

  # Archive helpers
  lastMinuteRecorded: BigInt!
  lastHourRecorded: BigInt!
  lastFifteenMinuteRecorded: BigInt!
  lastFourHourRecorded: BigInt!
}


# BID WALL

type BidWall @entity {
  # # event BidWallInitialized(PoolId _poolId, uint _eth, int24 _tickLower, int24 _tickUpper);
  # # event BidWallRepositioned(PoolId _poolId, uint _eth, int24 _tickLower, int24 _tickUpper);
  # # event BidWallClosed(PoolId _poolId, address _recipient, uint _eth);
  id: Bytes! #PoolID - Will be first set by `BidWallInitialized`
  contract: Bytes! # The address of the BidWall contract
  collectionToken: CollectionToken!
  pool: Pool!
  # Enabled by `BidWallInitialized` and disabled by `BidWallClosed`
  initialized: Boolean!
  # Bidwall tick range updated by `BidWallInitialized` and `BidWallRepositioned`
  tickLower: BigInt!
  tickUpper: BigInt!
  # Amount deposited in the BidWall. This will be cumulative.
  amount: BigInt! # redundant
  balance: BigInt!
  deployedETH: BigInt!
  closed: Boolean!
  
  distributions: [BidWallDistribution!] @derivedFrom(field: "bidWall")
}


