type Pool @entity {
  # event PoolCreated(PoolId _poolId, uint _initialTokenFairLaunch, uint _fairLaunchEnds, address _collection, address _collectionToken, address _creator);
  # event PoolStateUpdated(PoolId _poolId, uint160 _sqrtPriceX96, int24 _tick, uint24 _protocolFee, uint24 _swapFee, uint128 _liquidity);

  # event FeeDistributionUpdated(FeeDistribution _feeDistribution);
  # event PoolFeeDistributionUpdated(PoolId _poolId, FeeDistribution _feeDistribution);

  id: Bytes! # PoolId
  #/ The owner / dev of the token. This is set by `PoolCreated` and is updated by when the ERC721 that
  #/ is minted when `flaunch` is called is transferred.
  # creator: User!

  collectionToken: CollectionToken! #if you need ERC721 info its in this guy
  # string collectionTokenUri; - On collection

  # Uniswap V4 pool `slot0` values updated via `PoolStateUpdated`
  sqrtPriceX96: BigInt!
  tick: Int!

  # protocolFee: BigInt!
  # swapFee: BigInt!
  liveAtTimestamp: BigInt!

  startingMarketCap: BigInt!
  startingMarketCapETH: BigInt!  # todo: deprecate

  poolFees: PoolFees
  bidWall: BidWall
  feeDistribution: FeeDistribution # redundant
  volumeETH: BigInt!
  volumeUSDC: BigDecimal!
  totalFeesETH: BigInt!
  totalFeesToken: BigInt!
  totalFeesUSDC: BigDecimal!
  totalFeesTokenConverted: BigInt! # redundant
  memecoinTreasury: MemecoinTreasury

  # running total fees for Community
  totalCommunityFeesETH: BigDecimal!
  # running total fees for Creator
  totalCreatorFeesETH: BigDecimal!
  ispEthIn: BigInt!
  ispTokenOut: BigInt!
  liquidity: BigInt!
  tickSpacing: Int!
  fairLaunchedEnded: Boolean!
  feeAllocation: FeeAllocation
  # If false, token0 is native token (e.g. flETH)
  flipped: Boolean!
  swaps: [PoolSwap!] @derivedFrom(field: "pool")

  # The {PositionManager} address used to create the Pool
  positionManager: Bytes!
}

