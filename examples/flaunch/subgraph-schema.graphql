type ImportedToken @entity {
  id: Bytes!                         # Address of the imported token
  collectionToken: CollectionToken!  # The collection token schema linked to the imported token
  verifier: Bytes!                   # The address of the verifier that approved it
  sender: Bytes!                     # The address of the transaction sender
  importedAt: BigInt!                # The block timestamp that the token was imported
  txHash: Bytes!                     # The hash of the transaction
}

type TokenImporterVerifier @entity {
  id: Bytes!  # The address of the verifier
}

type FlaunchApproval @entity {
  id: Bytes! # flaunchAddr-owner-operator
  owner: User!
  operator: User!
  flaunchAddr: Bytes!
  tokens: [FlaunchApprovalToken!] @derivedFrom(field: "flaunchApproval")
  globalApproval: Boolean!
}

type FlaunchApprovalToken @entity {
  id: Bytes! # flaunchAddr-owner-tokenId
  flaunchApproval: FlaunchApproval!
  tokenId: BigInt!
  collection: Collection
  createdAt: BigInt!
  txHash: Bytes!
}

type Token @entity {
  id: Bytes! # Address
  name: String!
  symbol: String!
  decimals: Int!
  totalSupply: BigInt!
}
