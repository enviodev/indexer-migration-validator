type Activity @entity(immutable: true) {
  id: Bytes! # txhash-logindex
  maker: User!
  timestamp: BigInt!
  txHash: Bytes!
  token: CollectionToken!
  amountETH: BigInt!
  amountToken: BigInt!
  type: ActivityType!
}

enum ActivityType {
  Buy,
  Sell
}

type MemecoinTreasury @entity {
  id: Bytes! # treasury address
  pool: Pool!
  activities: [MemecoinTreasuryActivity!] @derivedFrom(field: "treasury")
  createdAt: BigInt!
  totalActions: BigInt!
  lastActionTimestamp: BigInt!
  totalETH: BigInt!
  totalToken: BigInt!
}

type MemecoinTreasuryActivity @entity {
  id: Bytes! # treasury address + tx hash + log index
  pool: Pool
  treasury: MemecoinTreasury
  action: MemecoinAction!
  tokenDelta0: BigInt! # Change in token0 balance
  tokenDelta1: BigInt! # Change in token1 balance
  timestamp: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
}

type MemecoinAction @entity {
  id: Bytes! # action contract address
  approved: Boolean!
  activities: [MemecoinTreasuryActivity!] @derivedFrom(field: "action")
  approvedAt: BigInt
  unapprovedAt: BigInt
  totalActions: BigInt!

  approvedBy: Bytes # address of who approved it
  unapprovedBy: Bytes # address of who unapproved it
}
